<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partajare Energie — Cooperativa de Energie & LIFE COMET</title>
    <link rel="icon" type="image/png" href="/static/img/logo-cooperativa-yellow-trans.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cde: {
                            yellow: '#DBE200',
                            dark: '#2F2F31',
                            darker: '#202022',
                            darkest: '#18181a',
                            gray: '#93A29B',
                            teal: '#0B7A75',
                            tealHover: '#09635f',
                            orange: '#FF9914',
                        },
                        emerald: {
                            450: '#0B7A75',
                            550: '#09635f',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- React 18 & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel Standalone for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-[#242426] text-slate-100 min-h-screen antialiased selection:bg-[#DBE200] selection:text-slate-900">
    <div id="root">
        <!-- Loading spinner placeholder until React mounts -->
        <div class="flex flex-col items-center justify-center min-h-screen text-slate-400 bg-[#242426]">
            <div class="relative w-20 h-20 mb-5">
                <div class="absolute inset-0 rounded-full border-4 border-[#2F2F31]"></div>
                <div class="absolute inset-0 rounded-full border-4 border-[#DBE200] border-t-transparent animate-spin"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <img src="/static/img/logo-cooperativa-yellow-trans.png" alt="Cooperativa de Energie" class="w-10 h-auto">
                </div>
            </div>
            <p class="text-lg font-bold text-slate-200">Se încarcă platforma Partajare Energie...</p>
            <p class="text-xs text-[#93A29B] mt-1.5 flex items-center gap-2">
                <span>Cooperativa de Energie</span>
                <span>•</span>
                <span>Finanțat prin LIFE COMET</span>
            </p>
        </div>
    </div>

    <!-- Application React Script -->
    <script type="text/babel" src="/static/app.js"></script>
</body>
</html>
